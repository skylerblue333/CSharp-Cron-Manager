name: schedule-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/SkySchedule.Tests.csproj
      - name: Build
        run: dotnet build CSharp-Cron-Manager.csproj -c Release --no-restore
      - name: Tests
        run: dotnet test tests/SkySchedule.Tests.csproj -c Release --no-restore
      - name: Dependency vulnerability report
        run: dotnet list tests/SkySchedule.Tests.csproj package --vulnerable --include-transitive
      - name: CLI smoke test
        run: dotnet run -c Release --no-build -- '*/15 * * * *' '2026-08-24T10:07:59Z' | grep -q '2026-08-24T10:15:00+00:00'
      - name: Build image
        run: docker build -t sky-schedule:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-schedule:ci --format '{{.Config.User}}')" = "app"
